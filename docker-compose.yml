version: '3.8'

services:
  botify:
    build: .
    container_name: botify_main
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GROK_API_KEY=${GROK_API_KEY}
      - BOT_USERNAME=${BOT_USERNAME}
      - YOOMONEY_WALLET=${YOOMONEY_WALLET}
      - YOOMONEY_SECRET=${YOOMONEY_SECRET}
      - YOOMONEY_FORWARD_URL=${YOOMONEY_FORWARD_URL:-}
      - WEBHOOK_PORT=8090
      - DB_PATH=/app/data/botify.db
    volumes:
      - ./data:/app/data
      - ./generated_bots:/app/generated_bots
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
