version: '3.8'

services:
  botify:
    build: .
    container_name: botify_main
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GROK_API_KEY=${GROK_API_KEY}
      - BOT_USERNAME=${BOT_USERNAME}
      - YOOMONEY_WALLET=${YOOMONEY_WALLET}
      - YOOMONEY_SECRET=${YOOMONEY_SECRET}
      - WEBHOOK_PORT=8080
      - DB_PATH=/app/botify.db
    volumes:
      - ./botify.db:/app/botify.db
      - ./generated_bots:/app/generated_bots
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-files: "3"
